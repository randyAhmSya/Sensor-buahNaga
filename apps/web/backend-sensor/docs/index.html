<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>AgroLight Documentation Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Dokumentasi Teknis API dan Arsitektur Backend AgroLight (Sistem Sensor & Otomasi Penyinaran Buah Naga)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Theme style: Vue themeable with custom AgroLight palette -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      --theme-color: #059669;
      --theme-color-dark: #047857;
      --text-color-base: #1f2937;
      --sidebar-width: 320px;
      --sidebar-nav-link-color: #4b5563;
      --sidebar-nav-link-color--active: #059669;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1f2937;
      background-color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Navbar & Sidebar */
    .sidebar {
      background-color: #f9fafb;
      border-right: 1px solid #e5e7eb;
    }

    .sidebar .app-name {
      font-weight: 700;
      font-size: 1.25rem;
      color: #065f46;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem 0.5rem;
    }

    .sidebar ul li a {
      font-size: 0.925rem;
      color: #4b5563;
      padding: 6px 16px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .sidebar ul li a:hover {
      color: #059669;
      background-color: #ecfdf5;
      text-decoration: none;
    }

    .sidebar ul li.active > a {
      color: #065f46;
      font-weight: 600;
      background-color: #d1fae5;
      border-right: 3px solid #059669;
    }

    /* Typography & Code Blocks */
    code, pre {
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace !important;
    }

    .markdown-section code {
      color: #047857;
      background-color: #f0fdf4;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.875em;
    }

    .markdown-section pre > code {
      color: #e5e7eb;
      background-color: #111827;
      padding: 1rem;
      border-radius: 8px;
    }

    /* Table styling */
    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
      font-size: 0.925rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-section th {
      background-color: #f3f4f6;
      color: #111827;
      font-weight: 600;
      border: 1px solid #e5e7eb;
      padding: 10px 14px;
      text-align: left;
    }

    .markdown-section td {
      border: 1px solid #e5e7eb;
      padding: 10px 14px;
    }

    .markdown-section tr:nth-child(even) {
      background-color: #f9fafb;
    }

    /* GitHub-style Alerts / Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid #10b981;
      background-color: #f0fdf4;
      color: #065f46;
      padding: 12px 16px;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
    }

    /* Search Input */
    .search input {
      border: 1px solid #d1d5db !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
      font-size: 0.9rem !important;
      background-color: #ffffff !important;
      transition: all 0.2s ease;
    }

    .search input:focus {
      border-color: #059669 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
    }

    /* Copy Code Button */
    .docsify-copy-code-button {
      background: rgba(255, 255, 255, 0.15) !important;
      color: #ffffff !important;
      font-size: 0.75rem !important;
      border-radius: 4px !important;
      padding: 4px 8px !important;
    }
  </style>
</head>
<body>
  <div id="app">Memuat dokumentasi AgroLight...</div>

  <script>
    window.$docsify = {
      name: '🐉 AgroLight Docs',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      themeColor: '#059669',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/': 'Cari dokumentasi...'
        },
        noData: {
          '/': 'Tidak ada hasil ditemukan'
        },
        depth: 4,
        hideOtherSidebarContent: false
      },
      copyCode: {
        buttonText: 'Salin',
        errorText: 'Gagal',
        successText: 'Tersalin'
      }
    };
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- PrismJS Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-php.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
